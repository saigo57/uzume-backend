[package]
name = "uzume-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio= { version="1.38", features = ["full"] }
axum={ version="0.7.5", features = ["multipart"] }
serde={ version="1.0", features = ["derive"] }
serde_json = "1.0.120"
uuid = { version = "1.10.0", features = ["v4"]}
rusqlite = { version = "0.32.0", features = ["bundled"]}
base64 = "0.22.1"
log = "0.4.22"
fern = "0.6.2"
chrono = "0.4.23"
hyper = "1.5.0"
bytes = "1.6.1"
image = "0.25"
regex = "1.11"
